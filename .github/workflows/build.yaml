name: build-project
on: push
#
jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main
      - name: install nix
        uses: cachix/install-nix-action@master
      - uses: cachix/cachix-action@master
        with:
          name: opensource
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: damianfral/nix-cache-lookup@master
        id: cache-lookup-default
        name: Check if already cached
        with:
          flake-attribute: .#default
      - run: nix build

        if: steps.cache-lookup-default.outputs.cached != 'true'
  build-dev-shell:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main
      - name: install nix
        uses: cachix/install-nix-action@master
      - uses: cachix/cachix-action@master
        with:
          name: opensource
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: damianfral/nix-cache-lookup@master
        id: cache-lookup-dev-shell-default
        name: Check if already cached
        with:
          flake-attribute: .#devShells.x86_64-linux.default
      - run: nix build .#devShells.x86_64-linux.default
        if: steps.cache-lookup-dev-shell-default.outputs.cached != 'true'
